<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1712"/>
      <stop offset="1" stop-color="#26211a"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="460" fill="url(#bg)"/>

  <!-- scene-history timeline -->
  <line x1="120" y1="360" x2="680" y2="360" stroke="#3a3224" stroke-width="2" stroke-dasharray="6 10"/>
  <circle cx="160" cy="360" r="6" fill="#3a3224"/>
  <circle cx="320" cy="360" r="6" fill="#3a3224"/>
  <circle cx="640" cy="360" r="6" fill="#3a3224"/>
  <circle cx="480" cy="360" r="10" fill="#5fd889" filter="url(#glow)"/>
  <line x1="480" y1="350" x2="480" y2="255" stroke="#5fd889" stroke-width="2" stroke-dasharray="4 7" opacity=".7"/>
  <text x="480" y="400" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="16" fill="#7fe3a3">last saved</text>

  <!-- undo ring -->
  <circle cx="400" cy="185" r="90" fill="none" stroke="#5fd889" stroke-width="14"
          stroke-linecap="round" stroke-dasharray="424 142" transform="rotate(-40 400 185)" filter="url(#glow)"/>
  <polygon points="470,108 445,100 452,132" fill="#5fd889"/>

  <!-- save glyph, centered -->
  <g>
    <rect x="374" y="161" width="52" height="48" rx="6" fill="#201b14" stroke="#5fd889" stroke-width="3"/>
    <rect x="396" y="161" width="18" height="14" fill="#201b14" stroke="#5fd889" stroke-width="3"/>
    <line x1="384" y1="196" x2="416" y2="196" stroke="#5fd889" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
