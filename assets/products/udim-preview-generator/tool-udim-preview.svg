<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1712"/>
      <stop offset="1" stop-color="#26211a"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="460" fill="url(#bg)"/>

  <!-- viewfinder corner brackets -->
  <g stroke="#4a4230" stroke-width="3" stroke-linecap="round" fill="none" opacity=".8">
    <path d="M50 90 L50 50 L90 50"/>
    <path d="M710 50 L750 50 L750 90"/>
    <path d="M50 370 L50 410 L90 410"/>
    <path d="M710 410 L750 410 L750 370"/>
  </g>

  <!-- 2x2 UDIM tile grid -->
  <g font-family="'IBM Plex Mono',monospace" font-size="20" text-anchor="middle">
    <!-- 1001 -->
    <g>
      <rect x="240" y="70" width="150" height="150" rx="8" fill="#2c2619" stroke="#3a3224" stroke-width="2"/>
      <rect x="240" y="70" width="75" height="75" fill="#332c1f"/>
      <rect x="315" y="145" width="75" height="75" fill="#332c1f"/>
      <text x="315" y="252" fill="#9c9284">1001</text>
    </g>
    <!-- 1002 (active tile) -->
    <g filter="url(#glow)">
      <rect x="410" y="70" width="150" height="150" rx="8" fill="#2c2619" stroke="#ff6a5a" stroke-width="3"/>
      <rect x="410" y="70" width="75" height="75" fill="#3a2a26"/>
      <rect x="485" y="145" width="75" height="75" fill="#3a2a26"/>
      <rect x="410" y="70" width="150" height="150" rx="8" fill="#ff6a5a" opacity=".08"/>
      <text x="485" y="252" fill="#ff9d8f">1002</text>
    </g>
    <!-- 1011 -->
    <g>
      <rect x="240" y="240" width="150" height="150" rx="8" fill="#2c2619" stroke="#3a3224" stroke-width="2"/>
      <rect x="240" y="240" width="75" height="75" fill="#332c1f"/>
      <rect x="315" y="315" width="75" height="75" fill="#332c1f"/>
      <text x="315" y="422" fill="#9c9284">1011</text>
    </g>
    <!-- 1012 -->
    <g>
      <rect x="410" y="240" width="150" height="150" rx="8" fill="#2c2619" stroke="#3a3224" stroke-width="2"/>
      <rect x="410" y="240" width="75" height="75" fill="#332c1f"/>
      <rect x="485" y="315" width="75" height="75" fill="#332c1f"/>
      <text x="485" y="422" fill="#9c9284">1012</text>
    </g>
  </g>
</svg>
