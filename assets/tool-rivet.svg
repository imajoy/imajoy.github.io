<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1712"/>
      <stop offset="1" stop-color="#26211a"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="460" fill="url(#bg)"/>

  <!-- perspective surface mesh -->
  <g stroke="#4a4230" stroke-width="1.6" fill="none" opacity=".85">
    <path d="M150 340 L650 340 L520 140 L280 140 Z"/>
    <line x1="340" y1="140" x2="275" y2="340"/>
    <line x1="400" y1="140" x2="400" y2="340"/>
    <line x1="460" y1="140" x2="525" y2="340"/>
    <line x1="237" y1="206" x2="562" y2="206"/>
    <line x1="194" y1="272" x2="606" y2="272"/>
  </g>

  <!-- attachment anchor + drop line -->
  <line x1="400" y1="150" x2="400" y2="232" stroke="#5fa8ff" stroke-width="2" stroke-dasharray="4 6"/>
  <rect x="393" y="136" width="14" height="14" fill="#201b14" stroke="#5fa8ff" stroke-width="2" transform="rotate(45 400 143)"/>

  <!-- locator crosshair pinned to the mesh vertex -->
  <g filter="url(#glow)">
    <circle cx="400" cy="272" r="10" fill="#5fa8ff"/>
    <line x1="400" y1="250" x2="400" y2="294" stroke="#5fa8ff" stroke-width="4" stroke-linecap="round"/>
    <line x1="378" y1="272" x2="422" y2="272" stroke="#5fa8ff" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="400" y="400" text-anchor="middle" font-family="'IBM Plex Mono',monospace" font-size="16" fill="#8fc4ff">pinned locator</text>
</svg>
