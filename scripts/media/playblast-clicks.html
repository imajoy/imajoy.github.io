<!doctype html><html lang="en"><meta charset="utf-8"><title>Playblast click-animation source</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#202123;width:540px;height:870px;font-family:Arial,sans-serif;color:#eef4ff}.guide{height:60px;display:flex;align-items:center;gap:12px;padding:0 18px;background:#141a24;border-bottom:1px solid #384354}.badge{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#315d9a;font-size:12px;color:#d5eaff}.guide b{display:block;font-size:14px}.guide small{display:block;margin-top:4px;color:#a6bad6;font-size:10px}.app{position:relative;width:540px;height:810px;overflow:hidden}.app>img{display:block;width:540px;height:810px}.camera-placeholder{position:absolute;left:147px;top:249px;width:160px;height:22px;padding-top:3px;background:#18191a;color:#9faab5;font-size:12px}.camera-view{position:absolute;left:350px;top:245px;width:160px;height:32px;display:grid;place-items:center;border:1px solid #315b96;border-radius:9px;background:#1f2d3e;color:#c2dcff;font-size:11px}.camera-view.clicked{border-color:#8dcaff;background:#315d91}.camera-arrow{position:absolute;left:316px;top:249px;color:#b6c0ca;font-size:16px}.camera-menu{position:absolute;left:136px;top:277px;width:200px;padding:4px;border:1px solid #3b5374;border-radius:6px;background:#22262d;box-shadow:0 8px 16px #0009}.camera-menu div{padding:10px 10px;font-size:12px;line-height:1}.camera-menu div:first-child{background:#315e9d;border-radius:4px}.shade{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0002}.dialog{width:450px;min-height:142px;border:1px solid #3c4045;border-radius:17px;background:#202123;box-shadow:0 15px 30px #0008;padding:19px 20px}.dialog-title{display:flex;align-items:center;gap:10px}.icon{display:grid;place-items:center;width:23px;height:23px;border-radius:7px;background:linear-gradient(130deg,#3b8bff,#43c9c4);color:white;font-size:13px}.dialog-title b{font-size:12px}.percent{margin-left:auto;color:#37d2da;font-size:13px;font-weight:bold}.meta{font-size:11px;color:#a7bdd3;margin:1 </style><div class="guide"><span class="badge" id="badge">01</span><div><b id="headline">Load your saved preset</b><small id="subline">Example preset: Review_1080p</small></div></div><div class="viewport"><div class="app"><img id="base" src="playblast-base.webp" alt="Playblast interface"><div id="placeholder" class="camera-placeholder">Select camera…</div><span class="camera-arrow">⌄</span><span id="view" class="camera-view">Maya Cam View</span><div id="menu" class="camera-menu hidden"><div>SH_000</div><div>Shot_000</div></div><div id="loaded" class="pressed hidden"></div><div id="progress" class="shade hidden"><div class="dialog"><div class="dialog-title"><span class="icon">▶</span><b>EXPORTING PLAYBLAST</b><span class="percent" id="percent">0%</span></div><div class="meta" id="meta">Exporting…</div><div class="track"><div id="fill" class="fill"></div></div><div class="cancel">Press Esc to cancel</div></div></div><div id="success" class="shade success hidden"><div class="dialog"><div class="dialog-title"><span class="icon">▶</span><b>SUCCESS</b><span>×</span></div><p>Playblast saved to:<br>C:\Projects\shot010\playblasts</p><div class="ok">OK</div></div></div><div id="ring" class="ring"></div><svg id="cursor" class="cursor" viewBox="0 0 24 28"><path d="M3 2v22l6-6 4 8 4-2-4-7h9Z"/></svg></div></div><script>
const $=id=>document.getElementById(id),ease=x=>x*x*(3-2*x),mix=(a,b,p)=>a+(b-a)*ease(Math.min(1,Math.max(0,p)));
const stage=document.querySelector('.viewport'),app=document.querySelector('.app');
for(const id of ['progress','success','ring','cursor'])stage.appendChild($(id));
const positions=[[0,475,645],[1,475,645],[1.8,405,118],[2.8,405,118],[3.6,320,260],[4.1,320,260],[4.9,195,293],[5.2,195,293],[6.05,430,260],[6.35,430,260],[7.1,272,762],[11.5,272,762],[12.5,437,459],[14.5,437,459],[16,437,459]];
window.renderFrame=t=>{
 let a=positions[0],b=a;for(let i=1;i<positions.length;i++){b=positions[i];if(t<=b[0])break;a=b;}let p=b[0]===a[0]?1:(t-a[0])/(b[0]-a[0]);let x=mix(a[1],b[1],p),y=mix(a[2],b[2],p);
 const scale=1.28,offset=14.4;
 let cameraY=-92;
 if(t>=6.35&&t<7.45)cameraY=mix(-92,-640,(t-6.35)/.8);
 else if(t>=7.45&&t<13.2)cameraY=mix(-640,-290,(t-7.45)/.75);
 else if(t>=13.2)cameraY=mix(-290,-92,(t-13.2)/2.3);
 app.style.transform=`translate(${offset}px,${cameraY}px) scale(${scale})`;
 if(t<7.45){x=x*scale+offset;y=y*scale+cameraY;}
 else{const u=Math.max(0,Math.min(1,(t-11.5)));x=mix(362,559,u);y=mix(335,252,u);}
 $('cursor').style.transform=`translate(${x}px,${y}px)`;$('cursor').style.opacity=t<.5?t*2:t>14.5?Math.max(0,1-(t-14.5)*2):1;
 const clicks=[1.85,3.7,5,6.15,7.2,12.7],click=clicks.find(c=>t>=c&&t<c+.4);let f=click===undefined?0:(t-click)/.4;
 $('ring').style.opacity=click===undefined?0:1-f;$('ring').style.transform=`translate(${x-18}px,${y-18}px) scale(${.3+f*.8})`;
 $('loaded').classList.toggle('hidden',!(t>=1.85&&t<2.6));$('view').classList.toggle('clicked',t>=6.15&&t<6.65);
 $('menu').classList.toggle('hidden',!(t>=3.8&&t<5.1));
 $('placeholder').style.opacity=t<5.1?1:t>15.5?(t-15.5)*2:0;
 let exporting=t>=7.45&&t<11.25,saved=t>=11.25&&t<12.95;
 $('progress').classList.toggle('hidden',!exporting);$('success').classList.toggle('hidden',!saved);
 const progress=Math.round(Math.min(1,Math.max(0,(t-7.6)/3.4))*100);$('percent').textContent=progress+'%';$('meta').textContent=progress===0?'Exporting…':`Frame ${progress}  |  ${progress} / 100  |  ${progress===100?'Finishing…':'ETA 0:02'}`;$('fill').style.transform=`scaleX(${progress/100})`;
 for(const [id,start]of [['progress',7.45],['success',11.25]]){const k=Math.min(1,Math.max(0,(t-start)/.2));$(id).style.opacity=k;$(id).querySelector('.dialog').style.transform=`translateY(${(1-k)*5}px)`;}
 let step=t<2.7?0:t<7.2?1:t<11.25?2:3;
 $('badge').textContent=['01','02','03','04'][step];$('headline').textContent=['Load your saved preset','Choose the Maya shot camera','Export the playblast','Confirm the saved preview'][step];$('subline').textContent=['Example preset: Review_1080p','Only names starting with SH_ or Shot_ are detected.','Capture the review movie from SH_000.','Click OK to finish.'][step];
 if(t>=2.1&&t<2.7){$('headline').textContent='Preset loaded: Review_1080p';$('subline').textContent='Next, choose the Maya shot camera.';}
 if(t>=6.15&&t<7.2){$('headline').textContent='Click Maya Cam View';$('subline').textContent='Look through SH_000 before exporting.';}
 if(t>13.1&&t<15.6){$('headline').textContent='Preview saved. Ready for the next shot.';$('subline').textContent='Load → Maya camera → Export → OK';}
 if(t>=15.6){$('badge').textContent='01';$('headline').textContent='Load your saved preset';$('subline').textContent='Example preset: Review_1080p';}
};renderFrame(0);
</script></html>
